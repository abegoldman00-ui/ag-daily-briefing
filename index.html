<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Daily Briefing</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <style>
    :root {
      --surface-0: #f5f6f8;
      --surface-1: #ffffff;
      --surface-2: #eef0f4;
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a72;
      --text-muted: #9898ab;
      --text-accent: #2563eb;
      --text-warning: #c2410c;
      --text-success: #15803d;
      --text-pro: #7c3aed;
      --text-due-soon: #b45309;
      --bg-accent: #eff6ff;
      --bg-warning: #fff7ed;
      --bg-success: #f0fdf4;
      --bg-pro: #f5f3ff;
      --bg-due-soon: #fffbeb;
      --border: #e5e7eb;
      --border-strong: #c5c8d0;
      --border-warning: #fb923c;
      --border-success: #4ade80;
      --border-accent: #93c5fd;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
        --surface-0: #0f0f17;
        --surface-1: #1a1a27;
        --surface-2: #24243a;
        --text-primary: #e8e8f0;
        --text-secondary: #a0a0b8;
        --text-muted: #6a6a80;
        --text-accent: #60a5fa;
        --text-warning: #fb923c;
        --text-success: #4ade80;
        --text-pro: #a78bfa;
        --text-due-soon: #fbbf24;
        --bg-accent: #172554;
        --bg-warning: #431407;
        --bg-success: #052e16;
        --bg-pro: #2e1065;
        --bg-due-soon: #422006;
        --border: #2a2a40;
        --border-strong: #3a3a55;
        --border-warning: #c2410c;
        --border-success: #15803d;
        --border-accent: #2563eb;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface-0: #0f0f17;
        --surface-1: #1a1a27;
        --surface-2: #24243a;
        --text-primary: #e8e8f0;
        --text-secondary: #a0a0b8;
        --text-muted: #6a6a80;
        --text-accent: #60a5fa;
        --text-warning: #fb923c;
        --text-success: #4ade80;
        --text-pro: #a78bfa;
        --text-due-soon: #fbbf24;
        --bg-accent: #172554;
        --bg-warning: #431407;
        --bg-success: #052e16;
        --bg-pro: #2e1065;
        --bg-due-soon: #422006;
        --border: #2a2a40;
        --border-strong: #3a3a55;
        --border-warning: #c2410c;
        --border-success: #15803d;
        --border-accent: #2563eb;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.5;
    }
    input, select, textarea, button {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-0);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    button { cursor: pointer; }
    button:hover { opacity: 0.85; }
    textarea { resize: vertical; }

    #auth-screen {
      max-width: 380px;
      margin: 120px auto;
      padding: 2.5rem;
      text-align: center;
      background: var(--surface-1);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
    }
    #auth-screen h2 { margin: 0 0 0.5rem; font-size: 24px; font-weight: 700; }
    #auth-screen p { margin: 0 0 1.5rem; font-size: 13px; color: var(--text-muted); }
    #auth-screen input { width: 100%; margin-bottom: 10px; }
    #auth-screen button { width: 100%; padding: 10px; font-weight: 500; }
    #auth-error { color: var(--text-warning); font-size: 13px; margin-top: 8px; }

    #app { display: none; }

    .header-bar {
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .stat-card {
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow 0.15s;
    }
    .stat-card:hover { box-shadow: var(--shadow-md); }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-size: 26px; font-weight: 700; margin-top: 4px; }

    .item-row {
      padding: 14px 16px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.15s;
      position: relative;
    }
    .item-row:hover { box-shadow: var(--shadow-md); }
    .item-row.high-priority {
      border-left: 3px solid var(--border-warning);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .item-row.due-soon {
      border-left: 3px solid var(--text-due-soon);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .item-row.dragging { opacity: 0.5; transform: scale(0.98); }
    .item-row.drag-over { border-top: 2px solid var(--text-accent); }

    .item-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      flex: 0 0 auto;
    }
    .item-row:hover .item-actions { opacity: 1; }
    @media (max-width: 600px) { .item-actions { opacity: 1; } }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-block;
    }

    .fbtn {
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .fbtn:hover { background: var(--surface-2); }

    .add-section {
      background: var(--surface-1);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--text-accent);
      color: white;
      border-color: var(--text-accent);
      font-weight: 500;
      padding: 8px 20px;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger {
      background: var(--text-warning);
      color: white;
      border-color: var(--text-warning);
      font-weight: 500;
      padding: 8px 20px;
    }

    .btn-ghost {
      border: none;
      background: none;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-ghost:hover { color: var(--text-primary); background: var(--surface-2); }

    .btn-icon {
      border: none;
      background: none;
      color: var(--text-muted);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    .btn-icon:hover { color: var(--text-primary); background: var(--surface-2); }
    .btn-icon.del:hover { color: var(--text-warning); background: var(--bg-warning); }

    .edit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .edit-panel {
      background: var(--surface-1);
      border-radius: 16px;
      padding: 1.5rem;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .edit-panel h3 { margin: 0 0 1rem; font-size: 17px; font-weight: 600; }
    .edit-panel label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
    .edit-panel input, .edit-panel select, .edit-panel textarea { width: 100%; margin-bottom: 2px; }
    .edit-panel .edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

    .confirm-panel {
      background: var(--surface-1);
      border-radius: 16px;
      padding: 1.75rem;
      width: 90%;
      max-width: 360px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      text-align: center;
    }
    .confirm-panel h3 { margin: 0 0 0.5rem; font-size: 17px; font-weight: 600; }
    .confirm-panel p { margin: 0 0 1.25rem; font-size: 13px; color: var(--text-secondary); }
    .confirm-panel .edit-actions { display: flex; gap: 8px; justify-content: center; }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header .count {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 1px 8px;
      border-radius: 10px;
    }

    .section-group {
      margin-bottom: 2rem;
    }

    .completed-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 12px 0;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      background: none;
      width: 100%;
      transition: color 0.15s;
    }
    .completed-toggle:hover { color: var(--text-secondary); }
    .completed-toggle .arrow { transition: transform 0.2s; display: inline-block; font-size: 10px; }
    .completed-toggle .arrow.open { transform: rotate(90deg); }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 4px;
      user-select: none;
      flex: 0 0 auto;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .item-row:hover .drag-handle { opacity: 1; }
    @media (max-width: 600px) { .drag-handle { opacity: 0.5; } }
    .drag-handle:active { cursor: grabbing; }

    .undo-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--surface-0);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .undo-toast button {
      background: none;
      border: none;
      color: var(--text-accent);
      font-weight: 600;
      font-size: 13px;
      padding: 0;
      cursor: pointer;
    }

    .relative-date {
      font-size: 11px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
    }
    .empty-state p { margin: 0; font-size: 14px; }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }

    .view-toggle {
      display: flex;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .view-toggle button {
      border: none;
      background: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .view-toggle button.active {
      background: var(--surface-1);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .cal-header {
      background: var(--surface-2);
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .cal-day {
      background: var(--surface-1);
      min-height: 90px;
      padding: 4px;
      vertical-align: top;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cal-day:hover { background: var(--surface-2); }
    .cal-day.other-month { opacity: 0.4; }
    .cal-day.today { background: var(--bg-accent); }
    .cal-day .day-num {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 2px 4px;
      display: inline-block;
    }
    .cal-day.today .day-num {
      background: var(--text-accent);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      text-align: center;
      line-height: 20px;
    }
    .cal-item {
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 4px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      font-weight: 500;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-nav h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .cal-nav button {
      border: 1px solid var(--border);
      background: var(--surface-1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-primary);
    }

    .repeat-badge {
      font-size: 10px;
      color: var(--text-accent);
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    @media print {
      #auth-screen, #app > div:first-child button, .fbtn, #clearlinks,
      #search, #fperson, #fcustomer, #typefilters, .add-section,
      button[data-del], button[data-toggle], button[data-expand], button[data-edit],
      .edit-overlay, .drag-handle, .completed-toggle, .undo-toast,
      .item-actions, .header-bar, .view-toggle, #calendar-view { display: none !important; }
      body { background: white; color: black; }
      .item-row { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="auth-screen">
  <h2>AG Daily Briefing</h2>
  <p>Sign in to access your board</p>
  <input id="auth-email" type="email" placeholder="Email" />
  <input id="auth-pass" type="password" placeholder="Password" />
  <button id="auth-login" class="btn-primary" style="width:100%; margin-bottom:6px;">Sign in</button>
  <button id="auth-signup" style="width:100%; background:var(--surface-2); color:var(--text-secondary); border-color:var(--border);">Create account</button>
  <div id="auth-error"></div>
</div>

<div id="app">
  <div id="ag-briefing-root" style="padding:0 1rem 2rem; max-width:760px; margin:0 auto;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0 8px; flex-wrap:wrap; gap:6px;">
      <div>
        <h2 style="font-size:22px; font-weight:700; margin:0; color:var(--text-primary); letter-spacing:-0.3px;">AG Daily Briefing</h2>
        <p id="date-subtitle" style="margin:3px 0 0; font-size:13px; color:var(--text-muted);"></p>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="btn-theme" style="font-size:14px; padding:4px 8px; border-radius:20px; border:1px solid var(--border); background:var(--surface-1);" title="Toggle dark/light mode">☀</button>
        <button id="btn-email" style="font-size:12px; padding:6px 16px; border-radius:20px;">Email briefing</button>
        <button id="btn-print" style="font-size:12px; padding:6px 16px; border-radius:20px;">Print</button>
        <button id="btn-logout" class="btn-ghost" style="font-size:12px;">Sign out</button>
      </div>
    </div>

    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; align-items:center;">
      <div style="position:relative; flex:1; min-width:120px;">
        <input id="search" type="text" placeholder="Search…" style="width:100%; box-sizing:border-box; padding-left:12px; padding-top:6px; padding-bottom:6px;" />
      </div>
      <select id="fperson" style="width:120px; padding:6px;"><option value="">Person: all</option></select>
      <select id="fcustomer" style="width:130px; padding:6px;"><option value="">Customer: all</option></select>
      <button id="toggle-add" style="font-size:12px; padding:6px 14px; border-radius:20px; background:#16a34a; color:#fff; border:none; cursor:pointer; white-space:nowrap; font-weight:600;">+ Add</button>
    </div>
    <div id="typefilters" style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; align-items:center;">
      <button data-filter="all" class="fbtn">All</button>
      <button data-filter="open" class="fbtn">Open</button>
      <button data-filter="today" class="fbtn">Today</button>
      <button data-filter="meeting" class="fbtn">Meetings</button>
      <button data-filter="doc" class="fbtn">Docs</button>
      <button id="clearlinks" style="display:none; font-size:12px; padding:6px 16px; border-radius:20px; color:var(--text-warning);">Clear filter</button>
      <div style="margin-left:auto;">
        <div class="view-toggle">
          <button id="view-list" class="active">List</button>
          <button id="view-calendar">Calendar</button>
        </div>
      </div>
    </div>

    <div id="add-panel" class="add-section" style="display:none;">
      <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
        <select id="kind" style="width:128px;">
          <option value="todo">To-do</option>
          <option value="reminder">Reminder</option>
          <option value="meeting">Meeting</option>
          <option value="doc">Doc / note</option>
        </select>
        <input id="entry" type="text" placeholder="Add an item…" style="flex:1; min-width:150px;" />
        <select id="priority" style="width:120px;">
          <option value="normal">Normal</option>
          <option value="high">High priority</option>
        </select>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
        <input id="people" type="text" placeholder="People (comma-separated)" style="flex:1; min-width:140px;" />
        <input id="customer" type="text" placeholder="Customer" list="custlist" style="flex:1; min-width:140px;" />
        <datalist id="custlist"></datalist>
        <input id="due" type="date" style="width:150px;" title="Due date" />
      </div>
      <input id="mtime" type="text" placeholder="Meeting time / location" style="width:100%; margin-bottom:8px; display:none; box-sizing:border-box;" />
      <textarea id="docbody" placeholder="Notes (optional)…" style="width:100%; min-height:60px; margin-bottom:8px; box-sizing:border-box;"></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <label id="repeat-wrap" style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); cursor:pointer;">
          <input id="repeat" type="checkbox" style="width:auto; padding:0; margin:0;" /> Repeats weekly
        </label>
        <button id="add" class="btn-primary">Add item</button>
      </div>
    </div>

    <div id="stats" class="stat-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:8px;"></div>
    <div id="list-view">
      <div id="list"></div>
      <div id="completed-section"></div>
    </div>
    <div id="calendar-view" style="display:none;"></div>
  </div>
</div>

<div id="day-preview" style="display:none; position:fixed; inset:0; z-index:999; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center;">
  <div id="day-preview-inner" style="background:var(--surface-1); border-radius:12px; padding:20px; max-width:420px; width:90%; max-height:70vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.25); position:relative;"></div>
</div>
<div id="edit-modal" class="edit-overlay" style="display:none;"></div>
<div id="undo-container"></div>

<script>
(function(){
  const SUPABASE_URL = window.__SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';
  const USE_SUPABASE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  let supabase = null;
  let session = null;

  if (USE_SUPABASE) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const authScreen = document.getElementById('auth-screen');
  const appEl = document.getElementById('app');
  const authError = document.getElementById('auth-error');

  async function initAuth() {
    if (!USE_SUPABASE) { showApp(); return; }
    const { data } = await supabase.auth.getSession();
    if (data.session) { session = data.session; showApp(); }
    supabase.auth.onAuthStateChange((_event, s) => {
      session = s;
      if (s) showApp(); else showAuth();
    });
  }

  async function migrateLocalToSupabase(){
    const migrated = localStorage.getItem('agbriefing:migrated');
    if(migrated) return;
    let local=[];
    try { local = JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch(e){}
    if(!local.length) return;
    for(const it of local){
      const row = {
        kind: it.kind, text: it.text, body: it.body || null,
        meta: it.meta || null, people: it.people || [], customer: it.customer || null,
        priority: it.priority || 'normal', due: it.due || null, done: !!it.done
      };
      await supabase.from('items').insert(row);
    }
    localStorage.setItem('agbriefing:migrated','1');
  }

  async function showApp() {
    authScreen.style.display = 'none';
    appEl.style.display = 'block';
    document.getElementById('date-subtitle').textContent = dayjs().format('dddd, MMMM D, YYYY');
    if(USE_SUPABASE) await migrateLocalToSupabase();
    load();
  }
  function showAuth() { authScreen.style.display = ''; appEl.style.display = 'none'; }

  document.getElementById('auth-login').onclick = async () => {
    authError.textContent = '';
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if (!USE_SUPABASE) { showApp(); return; }
    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if (error) authError.textContent = error.message;
  };
  document.getElementById('auth-signup').onclick = async () => {
    authError.textContent = '';
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if (!USE_SUPABASE) { showApp(); return; }
    const { error } = await supabase.auth.signUp({ email, password: pass });
    if (error) authError.textContent = error.message;
    else authError.textContent = 'Check your email for a confirmation link.';
  };
  document.getElementById('btn-logout').onclick = async () => {
    if (USE_SUPABASE) await supabase.auth.signOut();
    else showAuth();
  };

  const LSKEY = 'agbriefing:items:v3';
  if (!localStorage.getItem(LSKEY) && localStorage.getItem('agbriefing:items:v2')) {
    localStorage.setItem(LSKEY, localStorage.getItem('agbriefing:items:v2'));
  }
  let items = [], filter = 'all', fPerson = '', fCustomer = '', searchQ = '';
  let showCompleted = false;
  let undoTimer = null, undoItem = null;
  let dragId = null;
  let currentView = 'list';
  let calMonth = dayjs().month(), calYear = dayjs().year();

  const $ = id => document.getElementById(id);
  const listEl=$('list'),statsEl=$('stats'),entryEl=$('entry'),kindEl=$('kind'),mtimeEl=$('mtime'),
    docbodyEl=$('docbody'),peopleEl=$('people'),customerEl=$('customer'),dueEl=$('due'),prioEl=$('priority'),
    fPersonEl=$('fperson'),fCustomerEl=$('fcustomer'),clearLinksEl=$('clearlinks'),searchEl=$('search'),
    custlist=$('custlist'),editModal=$('edit-modal'),completedSection=$('completed-section'),
    undoContainer=$('undo-container'),repeatEl=$('repeat'),
    listView=$('list-view'),calendarView=$('calendar-view');

  const kindMeta={
    todo:{label:'To-do',color:'var(--text-accent)',bg:'var(--bg-accent)'},
    reminder:{label:'Reminder',color:'var(--text-warning)',bg:'var(--bg-warning)'},
    meeting:{label:'Meeting',color:'var(--text-pro)',bg:'var(--bg-pro)'},
    doc:{label:'Doc / note',color:'var(--text-secondary)',bg:'var(--surface-2)'}
  };

  function todayISO(){ return dayjs().format('YYYY-MM-DD'); }
  function parsePeople(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }
  function isOverdueOrToday(it){ return it.due && !it.done && (it.kind==='todo'||it.kind==='reminder') && dayjs(it.due).isBefore(dayjs(todayISO()).add(1,'day')); }
  function isDueSoon(it){
    if(!it.due || it.done || it.kind==='doc') return false;
    const d=dayjs(it.due), today=dayjs(todayISO());
    return d.isAfter(today) && d.isBefore(today.add(3,'day'));
  }

  function friendlyDate(dateStr){
    if(!dateStr) return '';
    const d=dayjs(dateStr), today=dayjs(todayISO());
    const diff=d.diff(today,'day');
    if(diff === 0) return 'Today';
    if(diff === 1) return 'Tomorrow';
    if(diff === -1) return 'Yesterday';
    if(diff < -1) return d.format('MMM D') + ' · ' + Math.abs(diff) + 'd overdue';
    if(diff <= 7) return d.format('ddd, MMM D');
    return d.format('MMM D');
  }

  function dateGroupKey(it){
    if(!it.due) return 'no-date';
    const d=dayjs(it.due), today=dayjs(todayISO());
    const diff=d.diff(today,'day');
    if(diff < 0) return 'overdue';
    if(diff === 0) return 'today';
    if(diff === 1) return 'tomorrow';
    if(diff <= 7) return 'this-week';
    return 'later';
  }

  const groupLabels = {
    'overdue': { label: 'Overdue', color: 'var(--text-warning)' },
    'today': { label: 'Today', color: 'var(--text-accent)' },
    'tomorrow': { label: 'Tomorrow', color: 'var(--text-primary)' },
    'this-week': { label: 'This Week', color: 'var(--text-secondary)' },
    'later': { label: 'Later', color: 'var(--text-muted)' },
    'no-date': { label: 'No due date', color: 'var(--text-muted)' }
  };
  const groupOrder = ['overdue','today','tomorrow','this-week','later','no-date'];

  function syncFields(){
    const k=kindEl.value;
    mtimeEl.style.display=k==='meeting'?'':'none';
    dueEl.style.display=(k==='todo'||k==='reminder'||k==='meeting')?'':'none';
    prioEl.style.display=k==='doc'?'none':'';
    entryEl.placeholder=k==='meeting'?'Meeting subject…':k==='doc'?'Title for this note…':'Add an item…';
  }
  kindEl.addEventListener('change',syncFields);

  async function load(){
    if (USE_SUPABASE) {
      const { data, error } = await supabase.from('items').select('*').order('created_at', { ascending: false });
      if (error) { console.error('load error:', error); items = []; }
      else {
        items = (data || []).map(row => {
          const dm = decodeMeta(row.meta);
          return {
            id: row.id, text: row.text, kind: row.kind, done: row.done,
            ts: new Date(row.created_at).getTime(), people: row.people || [],
            customer: row.customer || '', priority: row.priority,
            due: row.due || '', meta: dm.meta, body: row.body || '',
            repeat: dm.repeat, sortOrder: row.sort_order || 0
          };
        });
      }
    } else {
      try { items = JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch(e) { items = []; }
      items.forEach((it,i) => { if(!it.sortOrder) it.sortOrder = i; });
    }
    advanceRecurring();
    rebuildLinks(); render();
  }

  function advanceRecurring(){
    const today=dayjs(todayISO());
    items.forEach(it=>{
      if(it.repeat==='weekly' && it.due && !it.done){
        let d=dayjs(it.due);
        while(d.isBefore(today)){
          d=d.add(7,'day');
        }
        const newDue=d.format('YYYY-MM-DD');
        if(newDue!==it.due){
          it.due=newDue;
          saveItem(it);
        }
      }
    });
  }

  async function save(){
    if (!USE_SUPABASE) {
      try { localStorage.setItem(LSKEY, JSON.stringify(items.map(it => {
        const c = Object.assign({}, it);
        delete c._open;
        return c;
      }))); } catch(e) {}
    }
  }

  function encodeMeta(it){
    let m = it.meta || '';
    if(it.repeat) m = (m ? m+' [weekly]' : '[weekly]');
    return m;
  }
  function decodeMeta(metaStr){
    const hasRepeat = (metaStr||'').includes('[weekly]');
    const clean = (metaStr||'').replace(/\s*\[weekly\]/g,'').trim();
    return { meta: clean, repeat: hasRepeat ? 'weekly' : '' };
  }

  async function saveItem(it) {
    if (USE_SUPABASE) {
      const row = {
        id: it.id, kind: it.kind, text: it.text, body: it.body || null,
        meta: encodeMeta(it) || null, people: it.people || [], customer: it.customer || null,
        priority: it.priority, due: it.due || null, done: it.done
      };
      const { error } = await supabase.from('items').upsert(row);
      if (error) console.error('save error:', error);
    } else { save(); }
  }

  async function deleteItem(id) {
    if (USE_SUPABASE) {
      const { error } = await supabase.from('items').delete().eq('id', id);
      if (error) console.error('delete error:', error);
    } else { save(); }
  }

  function addItem(){
    const text=entryEl.value.trim(),k=kindEl.value;
    if(!text) return;
    const id = USE_SUPABASE ? crypto.randomUUID() : 'i'+Date.now();
    const maxOrder = items.reduce((m,it) => Math.max(m, it.sortOrder||0), 0);
    const it={id,text,kind:k,done:false,ts:Date.now(),
      people:parsePeople(peopleEl.value),customer:customerEl.value.trim(),
      priority:prioEl.value,
      due:(k==='todo'||k==='reminder'||k==='meeting')?dueEl.value:'',
      meta:k==='meeting'?mtimeEl.value.trim():'',
      body:docbodyEl.value.trim(),
      repeat:repeatEl.checked?'weekly':'',
      sortOrder:maxOrder+1};
    items.push(it);
    entryEl.value='';mtimeEl.value='';docbodyEl.value='';peopleEl.value='';customerEl.value='';dueEl.value='';prioEl.value='normal';repeatEl.checked=false;
    saveItem(it); rebuildLinks(); render();
  }

  function toggle(id){
    const it=items.find(x=>x.id===id);
    if(!it) return;
    if(it.repeat==='weekly' && !it.done && it.due){
      it.due=dayjs(it.due).add(7,'day').format('YYYY-MM-DD');
      saveItem(it); render();
    } else {
      it.done=!it.done;
      saveItem(it); render();
    }
  }

  function confirmDel(id){
    const it=items.find(x=>x.id===id);
    if(!it) return;
    editModal.innerHTML=`<div class="confirm-panel">
      <h3>Delete item?</h3>
      <p>"${esc(it.text)}" will be permanently removed.</p>
      <div class="edit-actions">
        <button id="del-cancel" style="padding:8px 18px;">Cancel</button>
        <button id="del-confirm" class="btn-danger">Delete</button>
      </div>
    </div>`;
    editModal.style.display='flex';
    document.getElementById('del-cancel').onclick=()=>{editModal.style.display='none';};
    editModal.onclick=(e)=>{if(e.target===editModal)editModal.style.display='none';};
    document.getElementById('del-confirm').onclick=()=>{
      editModal.style.display='none';
      undoItem = Object.assign({}, it);
      items=items.filter(x=>x.id!==id);
      deleteItem(id);
      rebuildLinks(); render();
      showUndo(it.text);
    };
  }

  function showUndo(text){
    if(undoTimer) clearTimeout(undoTimer);
    const short = text.length > 30 ? text.slice(0,30)+'…' : text;
    undoContainer.innerHTML=`<div class="undo-toast">"${esc(short)}" deleted <button id="undo-btn">Undo</button></div>`;
    document.getElementById('undo-btn').onclick=()=>{
      if(undoItem){
        items.push(undoItem);
        saveItem(undoItem);
        undoItem=null;
        rebuildLinks(); render();
      }
      undoContainer.innerHTML='';
      if(undoTimer) clearTimeout(undoTimer);
    };
    undoTimer = setTimeout(()=>{ undoContainer.innerHTML=''; undoItem=null; }, 6000);
  }

  function expand(id){const it=items.find(x=>x.id===id);if(it){it._open=!it._open;render();}}

  function openEdit(id){
    const it=items.find(x=>x.id===id);
    if(!it) return;
    editModal.innerHTML=`<div class="edit-panel">
      <h3>Edit item</h3>
      <label>Title</label>
      <input id="ed-text" type="text" value="${esc(it.text)}" />
      <label>Type</label>
      <select id="ed-kind">
        <option value="todo"${it.kind==='todo'?' selected':''}>To-do</option>
        <option value="reminder"${it.kind==='reminder'?' selected':''}>Reminder</option>
        <option value="meeting"${it.kind==='meeting'?' selected':''}>Meeting</option>
        <option value="doc"${it.kind==='doc'?' selected':''}>Doc / note</option>
      </select>
      <label>Priority</label>
      <select id="ed-priority">
        <option value="normal"${it.priority==='normal'?' selected':''}>Normal</option>
        <option value="high"${it.priority==='high'?' selected':''}>High priority</option>
      </select>
      <label>Due date</label>
      <input id="ed-due" type="date" value="${esc(it.due)}" />
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;">
        <input id="ed-repeat" type="checkbox" style="width:auto;padding:0;margin:0;" ${it.repeat==='weekly'?'checked':''} /> Repeats weekly
      </label>
      <label>People (comma-separated)</label>
      <input id="ed-people" type="text" value="${esc((it.people||[]).join(', '))}" />
      <label>Customer</label>
      <input id="ed-customer" type="text" value="${esc(it.customer)}" list="custlist" />
      <label>Meeting time / location</label>
      <input id="ed-meta" type="text" value="${esc(it.meta)}" />
      <label>Notes</label>
      <textarea id="ed-body" style="min-height:80px;">${esc(it.body)}</textarea>
      <div class="edit-actions">
        <button id="ed-cancel" style="padding:8px 18px;">Cancel</button>
        <button id="ed-save" class="btn-primary">Save</button>
      </div>
    </div>`;
    editModal.style.display='flex';
    document.getElementById('ed-cancel').onclick=()=>{editModal.style.display='none';};
    editModal.onclick=(e)=>{if(e.target===editModal)editModal.style.display='none';};
    document.getElementById('ed-save').onclick=()=>{
      it.text=document.getElementById('ed-text').value.trim()||it.text;
      it.kind=document.getElementById('ed-kind').value;
      it.priority=document.getElementById('ed-priority').value;
      it.due=document.getElementById('ed-due').value;
      it.repeat=document.getElementById('ed-repeat').checked?'weekly':'';
      it.people=parsePeople(document.getElementById('ed-people').value);
      it.customer=document.getElementById('ed-customer').value.trim();
      it.meta=document.getElementById('ed-meta').value.trim();
      it.body=document.getElementById('ed-body').value.trim();
      editModal.style.display='none';
      saveItem(it); rebuildLinks(); render();
    };
  }

  function rebuildLinks(){
    const ppl=new Set(),cust=new Set();
    items.forEach(it=>{(it.people||[]).forEach(p=>ppl.add(p));if(it.customer)cust.add(it.customer);});
    if(fPerson&&!ppl.has(fPerson))fPerson='';
    if(fCustomer&&!cust.has(fCustomer))fCustomer='';
    fPersonEl.innerHTML='<option value="">Person: all</option>'+[...ppl].sort().map(p=>`<option value="${esc(p)}"${p===fPerson?' selected':''}>${esc(p)}</option>`).join('');
    fCustomerEl.innerHTML='<option value="">Customer: all</option>'+[...cust].sort().map(c=>`<option value="${esc(c)}"${c===fCustomer?' selected':''}>${esc(c)}</option>`).join('');
    custlist.innerHTML=[...cust].sort().map(c=>`<option value="${esc(c)}">`).join('');
    clearLinksEl.style.display=(fPerson||fCustomer)?'':'none';
  }

  function matchSearch(it){
    if(!searchQ) return true;
    const q=searchQ.toLowerCase();
    return [it.text,it.body,it.customer,it.meta,(it.people||[]).join(' ')].filter(Boolean).some(s=>s.toLowerCase().includes(q));
  }

  function render(){
    const today=todayISO();
    let shown=items.filter(x=>!x.done);
    if(filter==='open') shown=shown.filter(x=>x.kind!=='doc');
    else if(filter==='today') shown=shown.filter(x=>x.due===today || isOverdueOrToday(x));
    else if(filter==='meeting') shown=shown.filter(x=>x.kind==='meeting');
    else if(filter==='doc') shown=shown.filter(x=>x.kind==='doc');
    if(fPerson) shown=shown.filter(x=>(x.people||[]).includes(fPerson));
    if(fCustomer) shown=shown.filter(x=>x.customer===fCustomer);
    shown=shown.filter(matchSearch);

    document.querySelectorAll('.fbtn').forEach(b=>{
      const on=b.getAttribute('data-filter')===filter;
      b.style.background=on?'var(--text-accent)':'';
      b.style.color=on?'white':'';
      b.style.borderColor=on?'var(--text-accent)':'';
    });

    const openTasks=items.filter(x=>!x.done&&(x.kind==='todo'||x.kind==='reminder')).length;
    const overdue=items.filter(isOverdueOrToday).length;
    const meetings=items.filter(x=>x.kind==='meeting'&&!x.done).length;
    const docs=items.filter(x=>x.kind==='doc').length;
    statsEl.innerHTML=[['Open tasks',openTasks,'var(--text-accent)'],['Due / overdue',overdue,overdue>0?'var(--text-warning)':'var(--text-primary)'],['Meetings',meetings,'var(--text-pro)'],['Docs / notes',docs,'var(--text-secondary)']]
      .map(([l,v,c])=>`<div class="stat-card"><div class="stat-label">${l}</div><div class="stat-value" style="color:${c};">${v}</div></div>`).join('');

    if(shown.length===0){
      const note=(fPerson||fCustomer||searchQ)?'No items match this filter.':'Nothing here yet. Add your first item above.';
      listEl.innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><p>${note}</p></div>`;
    } else {
      let html='';
      const groups={};
      shown.sort((a,b)=>{
        if(a.priority==='high'&&b.priority!=='high') return -1;
        if(b.priority==='high'&&a.priority!=='high') return 1;
        if(a.due&&b.due) return a.due<b.due?-1:a.due>b.due?1:0;
        if(a.due) return -1;
        if(b.due) return 1;
        const ao=a.sortOrder||0, bo=b.sortOrder||0;
        if(ao!==bo) return bo-ao;
        return b.ts-a.ts;
      }).forEach(it=>{
        const gk=dateGroupKey(it);
        (groups[gk]=groups[gk]||[]).push(it);
      });

      groupOrder.forEach(gk=>{
        if(!groups[gk]||!groups[gk].length) return;
        const g=groupLabels[gk];
        html+=`<div class="section-group">`;
        html+=`<div class="section-header" style="color:${g.color};">${g.label} <span class="count">${groups[gk].length}</span></div>`;
        groups[gk].forEach(it=>html+=rowHtml(it));
        html+=`</div>`;
      });
      listEl.innerHTML=html;
    }

    // Completed section
    let doneItems = items.filter(x=>x.done);
    if(fPerson) doneItems=doneItems.filter(x=>(x.people||[]).includes(fPerson));
    if(fCustomer) doneItems=doneItems.filter(x=>x.customer===fCustomer);
    doneItems=doneItems.filter(matchSearch);

    if(doneItems.length > 0){
      let chtml=`<button class="completed-toggle" id="toggle-completed"><span class="arrow${showCompleted?' open':''}">▶</span> Completed <span class="count" style="font-size:11px; font-weight:500; color:var(--text-muted); background:var(--surface-2); padding:1px 8px; border-radius:10px;">${doneItems.length}</span></button>`;
      if(showCompleted){
        chtml+=`<div style="margin-bottom:1.5rem;">`;
        doneItems.sort((a,b)=>b.ts-a.ts).forEach(it=>chtml+=rowHtml(it));
        chtml+=`</div>`;
      }
      completedSection.innerHTML=chtml;
      document.getElementById('toggle-completed').onclick=()=>{showCompleted=!showCompleted;render();};
    } else {
      completedSection.innerHTML='';
    }

    bind();
    if(currentView==='calendar') renderCalendar();
  }

  function rowHtml(it){
    const m=kindMeta[it.kind];
    const canCheck=(it.kind==='todo'||it.kind==='reminder'||it.kind==='meeting');
    const high=it.priority==='high'&&!it.done;
    const dueSoon=isDueSoon(it)&&!high;
    let cls='item-row';
    if(high) cls+=' high-priority';
    else if(dueSoon) cls+=' due-soon';
    let h=`<div class="${cls}" draggable="true" data-drag-id="${it.id}">`;
    h+=`<div style="display:flex; align-items:flex-start; gap:10px;">`;
    if(!it.done) h+=`<span class="drag-handle" title="Drag to reorder">⠿</span>`;
    if(canCheck) h+=`<button data-toggle="${it.id}" style="flex:0 0 auto; width:20px; height:20px; padding:0; border-radius:50%; border:2px solid ${it.done?'var(--text-success)':'var(--border-strong)'}; ${it.done?'background:var(--text-success); color:white;':'background:none;'} font-size:12px; line-height:16px; text-align:center; margin-top:1px; transition: border-color 0.15s;">${it.done?'✓':''}</button>`;
    else h+=`<span style="flex:0 0 auto; width:20px; text-align:center; color:var(--text-muted); margin-top:1px;">·</span>`;
    h+=`<div style="flex:1; min-width:0;">`;
    h+=`<div style="font-size:14px; font-weight:${it.done?'400':'500'}; color:${it.done?'var(--text-muted)':'var(--text-primary)'}; ${it.done?'text-decoration:line-through;':''} line-height:1.4;">${high?'<span style="color:var(--text-warning);">⚑</span> ':''}${esc(it.text)}</div>`;
    h+=`<div style="display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap;">`;
    h+=`<span class="tag" style="background:${m.bg}; color:${m.color};">${m.label}</span>`;
    if(it.meta) h+=`<span style="font-size:11px; color:var(--text-pro);">${esc(it.meta)}</span>`;
    if(it.due){
      const od=isOverdueOrToday(it);
      const ds=isDueSoon(it);
      let dueColor=od?'var(--text-warning)':ds?'var(--text-due-soon)':'var(--text-muted)';
      h+=`<span class="relative-date" style="color:${dueColor}; ${(od||ds)?'font-weight:600;':''}">${friendlyDate(it.due)}</span>`;
    }
    if(it.customer) h+=`<span data-fc="${esc(it.customer)}" class="tag" style="background:var(--bg-success); color:var(--text-success); cursor:pointer;">${esc(it.customer)}</span>`;
    (it.people||[]).forEach(p=>h+=`<span data-fp="${esc(p)}" class="tag" style="background:var(--surface-2); color:var(--text-secondary); cursor:pointer;">${esc(p)}</span>`);
    if(it.repeat==='weekly') h+=`<span class="repeat-badge">↻ Weekly</span>`;
    if(it.body) h+=`<button data-expand="${it.id}" class="btn-ghost" style="font-size:11px; padding:1px 6px; color:var(--text-accent);">${it._open?'Hide notes':'Notes'}</button>`;
    h+=`</div></div>`;
    h+=`<div class="item-actions">`;
    h+=`<button data-edit="${it.id}" class="btn-icon" title="Edit">✎</button>`;
    h+=`<button data-del="${it.id}" class="btn-icon del" title="Delete">×</button>`;
    h+=`</div>`;
    h+=`</div>`;
    if(it.body&&it._open) h+=`<div style="margin-top:10px; padding:10px 14px; background:var(--surface-0); border:1px solid var(--border); border-radius:8px; font-size:13px; line-height:1.6; white-space:pre-wrap; color:var(--text-secondary);">${esc(it.body)}</div>`;
    h+=`</div>`;
    return h;
  }

  function bind(){
    document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.getAttribute('data-toggle')));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDel(b.getAttribute('data-del')));
    document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>expand(b.getAttribute('data-expand')));
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.getAttribute('data-edit')));
    document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{fPerson=b.getAttribute('data-fp');fCustomer='';rebuildLinks();render();});
    document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{fCustomer=b.getAttribute('data-fc');fPerson='';rebuildLinks();render();});

    document.querySelectorAll('[data-drag-id]').forEach(el=>{
      el.addEventListener('dragstart',(e)=>{
        dragId=el.getAttribute('data-drag-id');
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
        dragId=null;
      });
      el.addEventListener('dragover',(e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        if(el.getAttribute('data-drag-id')!==dragId){
          document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
          el.classList.add('drag-over');
        }
      });
      el.addEventListener('dragleave',()=>{el.classList.remove('drag-over');});
      el.addEventListener('drop',(e)=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const targetId=el.getAttribute('data-drag-id');
        if(dragId && dragId!==targetId){
          const dragItem=items.find(x=>x.id===dragId);
          const targetItem=items.find(x=>x.id===targetId);
          if(dragItem && targetItem){
            const temp=dragItem.sortOrder;
            dragItem.sortOrder=targetItem.sortOrder;
            targetItem.sortOrder=temp;
            saveItem(dragItem);
            saveItem(targetItem);
            save();
            render();
          }
        }
      });
    });
  }

  function briefingDateGroups(){
    const typeLabels={todo:'To-do',reminder:'Reminder',meeting:'Meeting',doc:'Doc'};
    const allOpen=items.filter(x=>!x.done).sort((a,b)=>{
      if(a.due&&b.due) return a.due<b.due?-1:a.due>b.due?1:0;
      if(a.due) return -1;
      if(b.due) return 1;
      return b.ts-a.ts;
    });
    const groups={};
    allOpen.forEach(it=>{
      let label='No date';
      if(it.due){
        const d=dayjs(it.due),td=dayjs(todayISO()),diff=d.diff(td,'day');
        if(diff<0) label='Overdue';
        else if(diff===0) label='Today — '+d.format('ddd, MMM D');
        else if(diff===1) label='Tomorrow — '+d.format('ddd, MMM D');
        else label=d.format('dddd, MMM D');
      }
      (groups[label]=groups[label]||[]).push(it);
    });
    return {groups, typeLabels};
  }

  function buildBriefingHtml(){
    const today=dayjs().format('dddd, MMMM D, YYYY');
    const {groups, typeLabels} = briefingDateGroups();
    const typeColors={todo:'#2563eb',reminder:'#c2410c',meeting:'#7c3aed',doc:'#666'};
    const typeBg={todo:'#eff6ff',reminder:'#fff7ed',meeting:'#f5f3ff',doc:'#f5f5f5'};

    const openCount=items.filter(x=>!x.done&&x.kind!=='doc').length;
    const overdueCount=items.filter(isOverdueOrToday).length;
    const meetingCount=items.filter(x=>x.kind==='meeting'&&!x.done).length;

    let body=`
      <div style="background:linear-gradient(135deg,#1e3a5f,#2563eb);padding:28px 32px;border-radius:12px;margin-bottom:24px;">
        <h1 style="margin:0;font-size:24px;font-weight:700;color:white;letter-spacing:-0.3px;">AG Daily Briefing</h1>
        <p style="margin:6px 0 0;font-size:13px;color:rgba(255,255,255,0.75);">${today}</p>
      </div>
      <div style="display:flex;gap:16px;margin-bottom:24px;">
        <div style="flex:1;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:#8892a4;font-weight:600;">Open Items</div>
          <div style="font-size:28px;font-weight:700;color:#2563eb;margin-top:4px;">${openCount}</div>
        </div>
        <div style="flex:1;background:${overdueCount>0?'#fef2f2':'#f8fafc'};border:1px solid ${overdueCount>0?'#fecaca':'#e5e7eb'};border-radius:10px;padding:14px 18px;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:#8892a4;font-weight:600;">Overdue / Due Today</div>
          <div style="font-size:28px;font-weight:700;color:${overdueCount>0?'#c2410c':'#1a1a2e'};margin-top:4px;">${overdueCount}</div>
        </div>
        <div style="flex:1;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:#8892a4;font-weight:600;">Meetings</div>
          <div style="font-size:28px;font-weight:700;color:#7c3aed;margin-top:4px;">${meetingCount}</div>
        </div>
      </div>`;

    Object.keys(groups).forEach(dayLabel=>{
      const arr=groups[dayLabel];
      const isOverdue=dayLabel==='Overdue';
      const isToday=dayLabel.startsWith('Today');
      const color=isOverdue?'#c2410c':isToday?'#2563eb':'#374151';
      body+=`<div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:700;color:${color};padding-bottom:8px;border-bottom:2px solid ${isOverdue?'#fecaca':isToday?'#93c5fd':'#e5e7eb'};margin-bottom:10px;">${dayLabel} <span style="font-weight:400;color:#999;font-size:12px;">(${arr.length})</span></div>`;
      arr.forEach(it=>{
        const high=it.priority==='high';
        body+=`<div style="padding:10px 14px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:6px;${high?'background:#fffbeb;border-left:3px solid #fb923c;':''}">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <span style="display:inline-block;width:13px;height:13px;border:1.5px solid #bbb;border-radius:3px;margin-top:2px;flex-shrink:0;"></span>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:${high?'600':'500'};color:#1a1a2e;">${high?'<span style="color:#c2410c;">&#9873;</span> ':''}${esc(it.text)}</div>
              <div style="display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;">
                <span style="font-size:10px;font-weight:600;color:${typeColors[it.kind]};background:${typeBg[it.kind]};padding:2px 8px;border-radius:10px;">${typeLabels[it.kind]}</span>
                ${it.customer?'<span style="font-size:10px;font-weight:500;color:#15803d;background:#f0fdf4;padding:2px 8px;border-radius:10px;">'+esc(it.customer)+'</span>':''}
                ${(it.people||[]).length?'<span style="font-size:10px;color:#777;">'+it.people.map(p=>esc(p)).join(', ')+'</span>':''}
                ${it.repeat==='weekly'?'<span style="font-size:10px;color:#2563eb;">&#8635; Weekly</span>':''}
              </div>
              ${it.meta?'<div style="font-size:11px;color:#7c3aed;margin-top:3px;">'+esc(it.meta)+'</div>':''}
              ${it.body?'<div style="font-size:11px;color:#888;margin-top:3px;line-height:1.4;">'+esc(it.body.slice(0,150))+(it.body.length>150?'...':'')+'</div>':''}
            </div>
          </div>
        </div>`;
      });
      body+=`</div>`;
    });

    body+=`<div style="margin-top:32px;padding-top:14px;border-top:2px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;color:#aaa;">AG Daily Briefing</span>
      <span style="font-size:11px;color:#aaa;">Generated ${dayjs().format('MMM D, YYYY [at] h:mm A')}</span>
    </div>`;

    return {today, body};
  }

  function briefingFullHtml(){
    const {today, body} = buildBriefingHtml();
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AG Daily Briefing — ${today}</title><style>body{font-family:'Inter',system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#1a1a2e;-webkit-print-color-adjust:exact;print-color-adjust:exact;}@media print{body{margin:20px auto;}.no-print{display:none!important;}}</style></head><body>${body}</body></html>`;
  }

  function printBriefing(){
    let w=window.open('','_blank');
    w.document.write(briefingFullHtml());
    w.document.close(); w.print();
  }

  function emailBriefing(){
    const {groups, typeLabels} = briefingDateGroups();
    const today=dayjs().format('dddd, MMMM D, YYYY');
    let text='AG DAILY BRIEFING\n'+today+'\n\n';

    Object.keys(groups).forEach(dayLabel=>{
      const arr=groups[dayLabel];
      text+='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
      text+=dayLabel.toUpperCase()+' ('+arr.length+')\n';
      text+='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
      arr.forEach(it=>{
        const high=it.priority==='high';
        let line='  '+(high?'[!] ':'    ')+'['+typeLabels[it.kind]+'] '+it.text;
        if(it.customer) line+='\n        Customer: '+it.customer;
        if(it.people&&it.people.length) line+='\n        People: '+it.people.join(', ');
        if(it.meta) line+='\n        '+it.meta;
        if(it.repeat==='weekly') line+='\n        Repeats weekly';
        if(it.body) line+='\n        Note: '+it.body.slice(0,100)+(it.body.length>100?'...':'');
        text+=line+'\n\n';
      });
    });

    text+='━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nGenerated '+dayjs().format('MMM D, YYYY [at] h:mm A')+'\n';

    const subject='AG Daily Briefing — '+dayjs().format('MMM D, YYYY');
    window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text);
  }

  function renderCalendar(){
    const first=dayjs().year(calYear).month(calMonth).date(1);
    const startDay=first.day();
    const daysInMonth=first.daysInMonth();
    const prevMonth=first.subtract(1,'month');
    const prevDays=prevMonth.daysInMonth();
    const todayStr=todayISO();

    const itemsByDate={};
    items.forEach(it=>{
      if(!it.due) return;
      let dates=[it.due];
      if(it.repeat==='weekly' && !it.done){
        let d=dayjs(it.due);
        const end=first.add(42,'day');
        while(d.isBefore(end)){
          dates.push(d.format('YYYY-MM-DD'));
          d=d.add(7,'day');
        }
      }
      dates.forEach(dt=>{
        (itemsByDate[dt]=itemsByDate[dt]||[]).push(it);
      });
    });

    const monthLabel=first.format('MMMM YYYY');
    let html=`<div class="cal-nav">
      <button id="cal-prev">◀</button>
      <h3>${monthLabel}</h3>
      <button id="cal-next">▶</button>
    </div>`;
    html+=`<div class="calendar-grid">`;
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
      html+=`<div class="cal-header">${d}</div>`;
    });

    let dayNum=1, nextDayNum=1;
    const totalCells=Math.ceil((startDay+daysInMonth)/7)*7;
    for(let i=0;i<totalCells;i++){
      let dateStr='', num='', cls='cal-day';
      if(i<startDay){
        num=prevDays-startDay+i+1;
        const d=prevMonth.date(num);
        dateStr=d.format('YYYY-MM-DD');
        cls+=' other-month';
      } else if(dayNum<=daysInMonth){
        num=dayNum;
        dateStr=first.date(dayNum).format('YYYY-MM-DD');
        if(dateStr===todayStr) cls+=' today';
        dayNum++;
      } else {
        const d=first.add(1,'month').date(nextDayNum);
        dateStr=d.format('YYYY-MM-DD');
        num=nextDayNum++;
        cls+=' other-month';
      }

      html+=`<div class="${cls}" data-cal-date="${dateStr}">`;
      html+=`<div class="day-num">${num}</div>`;
      const dayItems=itemsByDate[dateStr]||[];
      const shown=dayItems.slice(0,3);
      const typeColors={todo:'#2563eb',reminder:'#c2410c',meeting:'#7c3aed',doc:'#888'};
      const typeBg={todo:'#eff6ff',reminder:'#fff7ed',meeting:'#f5f3ff',doc:'#f5f5f5'};
      shown.forEach(it=>{
        const bg=typeBg[it.kind]||'#f5f5f5';
        const color=typeColors[it.kind]||'#888';
        const doneStyle=it.done?'text-decoration:line-through; opacity:0.55;':'';
        html+=`<div class="cal-item" style="background:${bg};color:${color};${doneStyle}" data-edit="${it.id}" title="${esc(it.text)}">${it.priority==='high'?'⚑ ':''}${esc(it.text)}</div>`;
      });
      if(dayItems.length>3) html+=`<div style="font-size:10px;color:var(--text-muted);padding:1px 4px;">+${dayItems.length-3} more</div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
    calendarView.innerHTML=html;

    $('cal-prev').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();};
    $('cal-next').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();};
    calendarView.querySelectorAll('[data-edit]').forEach(el=>{
      el.onclick=(e)=>{e.stopPropagation();openEdit(el.getAttribute('data-edit'));};
    });
    calendarView.querySelectorAll('[data-cal-date]').forEach(el=>{
      el.onclick=()=>{
        const d=el.getAttribute('data-cal-date');
        const dayItems=itemsByDate[d]||[];
        const label=dayjs(d).format('dddd, MMMM D, YYYY');
        const typeIcons={todo:'☐',reminder:'🔔',meeting:'📅',doc:'📄'};
        const typeColors={todo:'#2563eb',reminder:'#c2410c',meeting:'#7c3aed',doc:'#888'};
        let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;font-size:16px;color:var(--text-primary);">${label}</h3>
          <button id="day-preview-close" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:0 4px;">✕</button>
        </div>`;
        if(!dayItems.length){
          h+=`<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px 0;">No items scheduled</p>`;
        } else {
          dayItems.forEach(it=>{
            const color=typeColors[it.kind]||'#888';
            const icon=typeIcons[it.kind]||'';
            const doneStyle=it.done?'text-decoration:line-through; opacity:0.55;':'';
            h+=`<div class="day-preview-item" data-edit="${it.id}" style="padding:10px 12px;border-radius:8px;margin-bottom:6px;background:var(--surface-2);cursor:pointer;border-left:3px solid ${color};${doneStyle}">
              <div style="font-size:14px;font-weight:500;color:var(--text-primary);">${icon} ${it.priority==='high'?'<span style="color:#dc2626;">⚑</span> ':''}${esc(it.text)}</div>
              ${it.people&&it.people.length?`<div style="font-size:12px;color:var(--text-muted);margin-top:3px;">👤 ${it.people.join(', ')}</div>`:''}
              ${it.customer?`<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">🏢 ${it.customer}</div>`:''}
              ${it.meta?`<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">📍 ${it.meta}</div>`:''}
              ${it.body?`<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;white-space:pre-wrap;">${esc(it.body).substring(0,120)}${it.body.length>120?'…':''}</div>`:''}
            </div>`;
          });
        }
        h+=`<button id="day-preview-add" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--border);color:var(--text-muted);cursor:pointer;font-size:13px;">+ Add item on this day</button>`;
        const overlay=$('day-preview');
        $('day-preview-inner').innerHTML=h;
        overlay.style.display='flex';
        $('day-preview-close').onclick=()=>{overlay.style.display='none';};
        overlay.onclick=(e)=>{if(e.target===overlay)overlay.style.display='none';};
        $('day-preview-inner').querySelectorAll('[data-edit]').forEach(el2=>{
          el2.onclick=(e)=>{e.stopPropagation();overlay.style.display='none';openEdit(el2.getAttribute('data-edit'));};
        });
        $('day-preview-add').onclick=()=>{overlay.style.display='none';dueEl.value=d;$('add-panel').style.display='';$('toggle-add').textContent='✕ Close';entryEl.focus();};
      };
    });
  }

  function switchView(){
    if(currentView==='list'){
      listView.style.display='';
      calendarView.style.display='none';
      $('view-list').classList.add('active');
      $('view-calendar').classList.remove('active');
    } else {
      listView.style.display='none';
      calendarView.style.display='';
      $('view-list').classList.remove('active');
      $('view-calendar').classList.add('active');
      renderCalendar();
    }
  }

  function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  $('add').onclick=addItem;
  entryEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&kindEl.value!=='doc')addItem();});
  document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{filter=b.getAttribute('data-filter');render();});
  fPersonEl.onchange=()=>{fPerson=fPersonEl.value;render();rebuildLinks();};
  fCustomerEl.onchange=()=>{fCustomer=fCustomerEl.value;render();rebuildLinks();};
  clearLinksEl.onclick=()=>{fPerson='';fCustomer='';rebuildLinks();render();};
  searchEl.addEventListener('input',()=>{searchQ=searchEl.value.trim();render();});
  $('btn-print').onclick=printBriefing;
  $('btn-email').onclick=emailBriefing;
  $('toggle-add').onclick=()=>{const p=$('add-panel');const show=p.style.display==='none';p.style.display=show?'':'none';$('toggle-add').textContent=show?'✕ Close':'+ Add';if(show)$('entry').focus();};
  $('view-list').onclick=()=>{currentView='list';switchView();};
  $('view-calendar').onclick=()=>{currentView='calendar';switchView();};

  const themeBtn=$('btn-theme');
  function applyTheme(t){
    if(t==='light'){document.documentElement.setAttribute('data-theme','light');themeBtn.textContent='☾';}
    else if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');themeBtn.textContent='☀';}
    else{document.documentElement.removeAttribute('data-theme');themeBtn.textContent=window.matchMedia('(prefers-color-scheme:dark)').matches?'☀':'☾';}
  }
  const savedTheme=localStorage.getItem('agbriefing:theme')||'auto';
  applyTheme(savedTheme);
  themeBtn.onclick=()=>{
    const cur=localStorage.getItem('agbriefing:theme')||'auto';
    const next=cur==='auto'?'dark':cur==='dark'?'light':'auto';
    localStorage.setItem('agbriefing:theme',next);
    applyTheme(next);
  };

  syncFields();
  initAuth();
})();
</script>
</body>
</html>
