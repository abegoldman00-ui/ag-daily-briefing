<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Daily Briefing</title>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --surface-0: #f8f9fb;
      --surface-1: #ffffff;
      --surface-2: #f0f1f4;
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a72;
      --text-muted: #9898ab;
      --text-accent: #2563eb;
      --text-warning: #c2410c;
      --text-success: #15803d;
      --text-pro: #7c3aed;
      --text-due-soon: #b45309;
      --bg-accent: #eff6ff;
      --bg-warning: #fff7ed;
      --bg-success: #f0fdf4;
      --bg-pro: #f5f3ff;
      --bg-due-soon: #fffbeb;
      --border: #e2e4ea;
      --border-strong: #c5c8d0;
      --border-warning: #fb923c;
      --border-success: #4ade80;
      --border-accent: #93c5fd;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #111118;
        --surface-1: #1c1c27;
        --surface-2: #26263a;
        --text-primary: #e8e8f0;
        --text-secondary: #a0a0b8;
        --text-muted: #6a6a80;
        --text-accent: #60a5fa;
        --text-warning: #fb923c;
        --text-success: #4ade80;
        --text-pro: #a78bfa;
        --text-due-soon: #fbbf24;
        --bg-accent: #172554;
        --bg-warning: #431407;
        --bg-success: #052e16;
        --bg-pro: #2e1065;
        --bg-due-soon: #422006;
        --border: #2a2a40;
        --border-strong: #3a3a55;
        --border-warning: #c2410c;
        --border-success: #15803d;
        --border-accent: #2563eb;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.5;
    }
    input, select, textarea, button {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-0);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    button { cursor: pointer; }
    button:hover { opacity: 0.85; }
    textarea { resize: vertical; }

    #auth-screen {
      max-width: 360px;
      margin: 120px auto;
      padding: 2rem;
      text-align: center;
      background: var(--surface-1);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
    }
    #auth-screen h2 { margin: 0 0 0.5rem; font-size: 22px; font-weight: 600; }
    #auth-screen p { margin: 0 0 1.5rem; font-size: 13px; color: var(--text-muted); }
    #auth-screen input { width: 100%; margin-bottom: 10px; }
    #auth-screen button { width: 100%; padding: 9px; font-weight: 500; }
    #auth-error { color: var(--text-warning); font-size: 13px; margin-top: 8px; }

    #app { display: none; }

    .stat-card {
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-size: 24px; font-weight: 600; margin-top: 2px; }

    .item-row {
      padding: 12px 14px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .item-row:hover { box-shadow: var(--shadow-md); }
    .item-row.high-priority {
      border-left: 3px solid var(--border-warning);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .item-row.due-soon {
      border-left: 3px solid var(--text-due-soon);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .item-row.dragging { opacity: 0.5; transform: scale(0.98); }
    .item-row.drag-over { border-top: 2px solid var(--text-accent); }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-block;
    }

    .fbtn {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .fbtn:hover { background: var(--surface-2); }

    .add-section {
      background: var(--surface-1);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--text-accent);
      color: white;
      border-color: var(--text-accent);
      font-weight: 500;
      padding: 7px 18px;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger {
      background: var(--text-warning);
      color: white;
      border-color: var(--text-warning);
      font-weight: 500;
      padding: 7px 18px;
    }

    .btn-ghost {
      border: none;
      background: none;
      color: var(--text-muted);
      padding: 4px 8px;
    }
    .btn-ghost:hover { color: var(--text-primary); }

    .edit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .edit-panel {
      background: var(--surface-1);
      border-radius: 14px;
      padding: 1.25rem;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
    }
    .edit-panel h3 { margin: 0 0 1rem; font-size: 16px; font-weight: 600; }
    .edit-panel label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; margin-top: 10px; }
    .edit-panel input, .edit-panel select, .edit-panel textarea { width: 100%; margin-bottom: 2px; }
    .edit-panel .edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    .confirm-panel {
      background: var(--surface-1);
      border-radius: 14px;
      padding: 1.5rem;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
      text-align: center;
    }
    .confirm-panel h3 { margin: 0 0 0.5rem; font-size: 16px; font-weight: 600; }
    .confirm-panel p { margin: 0 0 1.25rem; font-size: 13px; color: var(--text-secondary); }
    .confirm-panel .edit-actions { display: flex; gap: 8px; justify-content: center; }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .completed-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 10px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      background: none;
      width: 100%;
    }
    .completed-toggle:hover { color: var(--text-secondary); }
    .completed-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    .completed-toggle .arrow.open { transform: rotate(90deg); }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 4px;
      user-select: none;
      flex: 0 0 auto;
    }
    .drag-handle:active { cursor: grabbing; }

    .undo-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--surface-0);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .undo-toast button {
      background: none;
      border: none;
      color: var(--text-accent);
      font-weight: 600;
      font-size: 13px;
      padding: 0;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    @media print {
      #auth-screen, #app > div:first-child button, .fbtn, #clearlinks,
      #search, #fperson, #fcustomer, #typefilters, .add-section,
      button[data-del], button[data-toggle], button[data-expand], button[data-edit],
      .edit-overlay, .drag-handle, .completed-toggle, .undo-toast { display: none !important; }
      body { background: white; color: black; }
      .item-row { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="auth-screen">
  <h2>AG Daily Briefing</h2>
  <p>Sign in to access your board</p>
  <input id="auth-email" type="email" placeholder="Email" />
  <input id="auth-pass" type="password" placeholder="Password" />
  <button id="auth-login" class="btn-primary" style="width:100%; margin-bottom:6px;">Sign in</button>
  <button id="auth-signup" style="width:100%; background:var(--surface-2); color:var(--text-secondary); border-color:var(--border);">Create account</button>
  <div id="auth-error"></div>
</div>

<div id="app">
  <div id="ag-briefing-root" style="padding:1rem 1rem; max-width:740px; margin:0 auto;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:8px;">
      <div>
        <h2 style="font-size:20px; font-weight:600; margin:0; color:var(--text-primary);">AG Daily Briefing</h2>
        <p id="date-subtitle" style="margin:2px 0 0; font-size:13px; color:var(--text-muted);"></p>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="btn-print" style="font-size:12px; padding:5px 14px; border-radius:20px;">Print</button>
        <button id="btn-logout" class="btn-ghost" style="font-size:12px;">Sign out</button>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;">
      <div style="position:relative; flex:1; min-width:160px;">
        <input id="search" type="text" placeholder="Search everything…" style="width:100%; box-sizing:border-box; padding-left:12px;" />
      </div>
      <select id="fperson" style="width:140px;"><option value="">Person: all</option></select>
      <select id="fcustomer" style="width:150px;"><option value="">Customer: all</option></select>
    </div>
    <div id="typefilters" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.5rem;">
      <button data-filter="all" class="fbtn">All</button>
      <button data-filter="open" class="fbtn">Open</button>
      <button data-filter="today" class="fbtn">Today</button>
      <button data-filter="meeting" class="fbtn">Meetings</button>
      <button data-filter="doc" class="fbtn">Docs</button>
      <button id="clearlinks" style="display:none; font-size:12px; padding:5px 14px; border-radius:20px; color:var(--text-warning);">Clear filter</button>
    </div>

    <div class="add-section">
      <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
        <select id="kind" style="width:128px;">
          <option value="todo">To-do</option>
          <option value="reminder">Reminder</option>
          <option value="meeting">Meeting</option>
          <option value="doc">Doc / note</option>
        </select>
        <input id="entry" type="text" placeholder="Add an item…" style="flex:1; min-width:150px;" />
        <select id="priority" style="width:120px;">
          <option value="normal">Normal</option>
          <option value="high">High priority</option>
        </select>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
        <input id="people" type="text" placeholder="People (comma-separated)" style="flex:1; min-width:140px;" />
        <input id="customer" type="text" placeholder="Customer" list="custlist" style="flex:1; min-width:140px;" />
        <datalist id="custlist"></datalist>
        <input id="due" type="date" style="width:150px;" title="Due date" />
      </div>
      <input id="mtime" type="text" placeholder="Meeting time / location" style="width:100%; margin-bottom:8px; display:none; box-sizing:border-box;" />
      <textarea id="docbody" placeholder="Notes (optional)…" style="width:100%; min-height:60px; margin-bottom:8px; box-sizing:border-box;"></textarea>
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:8px;">
        <button id="add" class="btn-primary">Add item</button>
      </div>
    </div>

    <div id="stats" class="stat-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.5rem;"></div>
    <div id="list"></div>
    <div id="completed-section"></div>
  </div>
</div>

<div id="edit-modal" class="edit-overlay" style="display:none;"></div>
<div id="undo-container"></div>

<script>
(function(){
  const SUPABASE_URL = window.__SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY || '';
  const USE_SUPABASE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  let supabase = null;
  let session = null;

  if (USE_SUPABASE) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  const authScreen = document.getElementById('auth-screen');
  const appEl = document.getElementById('app');
  const authError = document.getElementById('auth-error');

  async function initAuth() {
    if (!USE_SUPABASE) { showApp(); return; }
    const { data } = await supabase.auth.getSession();
    if (data.session) { session = data.session; showApp(); }
    supabase.auth.onAuthStateChange((_event, s) => {
      session = s;
      if (s) showApp(); else showAuth();
    });
  }

  function showApp() {
    authScreen.style.display = 'none';
    appEl.style.display = 'block';
    document.getElementById('date-subtitle').textContent = dayjs().format('dddd, MMMM D, YYYY');
    load();
  }
  function showAuth() { authScreen.style.display = ''; appEl.style.display = 'none'; }

  document.getElementById('auth-login').onclick = async () => {
    authError.textContent = '';
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if (!USE_SUPABASE) { showApp(); return; }
    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if (error) authError.textContent = error.message;
  };
  document.getElementById('auth-signup').onclick = async () => {
    authError.textContent = '';
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if (!USE_SUPABASE) { showApp(); return; }
    const { error } = await supabase.auth.signUp({ email, password: pass });
    if (error) authError.textContent = error.message;
    else authError.textContent = 'Check your email for a confirmation link.';
  };
  document.getElementById('btn-logout').onclick = async () => {
    if (USE_SUPABASE) await supabase.auth.signOut();
    else showAuth();
  };

  const LSKEY = 'agbriefing:items:v3';
  if (!localStorage.getItem(LSKEY) && localStorage.getItem('agbriefing:items:v2')) {
    localStorage.setItem(LSKEY, localStorage.getItem('agbriefing:items:v2'));
  }
  let items = [], filter = 'all', fPerson = '', fCustomer = '', searchQ = '';
  let showCompleted = false;
  let undoTimer = null, undoItem = null;
  let dragId = null;

  const $ = id => document.getElementById(id);
  const listEl=$('list'),statsEl=$('stats'),entryEl=$('entry'),kindEl=$('kind'),mtimeEl=$('mtime'),
    docbodyEl=$('docbody'),peopleEl=$('people'),customerEl=$('customer'),dueEl=$('due'),prioEl=$('priority'),
    fPersonEl=$('fperson'),fCustomerEl=$('fcustomer'),clearLinksEl=$('clearlinks'),searchEl=$('search'),
    custlist=$('custlist'),editModal=$('edit-modal'),completedSection=$('completed-section'),
    undoContainer=$('undo-container');

  const kindMeta={
    todo:{label:'To-do',color:'var(--text-accent)',bg:'var(--bg-accent)'},
    reminder:{label:'Reminder',color:'var(--text-warning)',bg:'var(--bg-warning)'},
    meeting:{label:'Meeting',color:'var(--text-pro)',bg:'var(--bg-pro)'},
    doc:{label:'Doc / note',color:'var(--text-secondary)',bg:'var(--surface-2)'}
  };

  function todayISO(){ return dayjs().format('YYYY-MM-DD'); }
  function dayLabel(d){ return dayjs(d).format('dddd, MMM D'); }
  function parsePeople(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }
  function isOverdueOrToday(it){ return it.due && !it.done && (it.kind==='todo'||it.kind==='reminder') && dayjs(it.due).isBefore(dayjs(todayISO()).add(1,'day')); }
  function isDueSoon(it){
    if(!it.due || it.done || it.kind==='doc') return false;
    const d=dayjs(it.due), today=dayjs(todayISO());
    return d.isAfter(today) && d.isBefore(today.add(3,'day'));
  }

  function syncFields(){
    const k=kindEl.value;
    mtimeEl.style.display=k==='meeting'?'':'none';
    dueEl.style.display=(k==='todo'||k==='reminder'||k==='meeting')?'':'none';
    prioEl.style.display=k==='doc'?'none':'';
    entryEl.placeholder=k==='meeting'?'Meeting subject…':k==='doc'?'Title for this note…':'Add an item…';
  }
  kindEl.addEventListener('change',syncFields);

  async function load(){
    if (USE_SUPABASE) {
      const { data, error } = await supabase.from('items').select('*').order('created_at', { ascending: false });
      if (error) { console.error('load error:', error); items = []; }
      else {
        items = (data || []).map(row => ({
          id: row.id, text: row.text, kind: row.kind, done: row.done,
          ts: new Date(row.created_at).getTime(), people: row.people || [],
          customer: row.customer || '', priority: row.priority,
          due: row.due || '', meta: row.meta || '', body: row.body || '',
          sortOrder: row.sort_order || 0
        }));
      }
    } else {
      try { items = JSON.parse(localStorage.getItem(LSKEY) || '[]'); } catch(e) { items = []; }
      items.forEach((it,i) => { if(!it.sortOrder) it.sortOrder = i; });
    }
    rebuildLinks(); render();
  }

  async function save(){
    if (!USE_SUPABASE) {
      try { localStorage.setItem(LSKEY, JSON.stringify(items.map(it => {
        const c = Object.assign({}, it);
        delete c._open;
        return c;
      }))); } catch(e) {}
    }
  }

  async function saveItem(it) {
    if (USE_SUPABASE) {
      const row = {
        id: it.id, kind: it.kind, text: it.text, body: it.body || null,
        meta: it.meta || null, people: it.people || [], customer: it.customer || null,
        priority: it.priority, due: it.due || null, done: it.done
      };
      const { error } = await supabase.from('items').upsert(row);
      if (error) console.error('save error:', error);
    } else { save(); }
  }

  async function deleteItem(id) {
    if (USE_SUPABASE) {
      const { error } = await supabase.from('items').delete().eq('id', id);
      if (error) console.error('delete error:', error);
    } else { save(); }
  }

  function addItem(){
    const text=entryEl.value.trim(),k=kindEl.value;
    if(!text) return;
    const id = USE_SUPABASE ? crypto.randomUUID() : 'i'+Date.now();
    const maxOrder = items.reduce((m,it) => Math.max(m, it.sortOrder||0), 0);
    const it={id,text,kind:k,done:false,ts:Date.now(),
      people:parsePeople(peopleEl.value),customer:customerEl.value.trim(),
      priority:prioEl.value,
      due:(k==='todo'||k==='reminder'||k==='meeting')?dueEl.value:'',
      meta:k==='meeting'?mtimeEl.value.trim():'',
      body:docbodyEl.value.trim(),
      sortOrder:maxOrder+1};
    items.push(it);
    entryEl.value='';mtimeEl.value='';docbodyEl.value='';peopleEl.value='';customerEl.value='';dueEl.value='';prioEl.value='normal';
    saveItem(it); rebuildLinks(); render();
  }

  function toggle(id){const it=items.find(x=>x.id===id);if(it){it.done=!it.done;saveItem(it);render();}}

  function confirmDel(id){
    const it=items.find(x=>x.id===id);
    if(!it) return;
    editModal.innerHTML=`<div class="confirm-panel">
      <h3>Delete item?</h3>
      <p>"${esc(it.text)}" will be permanently removed.</p>
      <div class="edit-actions">
        <button id="del-cancel" style="padding:7px 16px;">Cancel</button>
        <button id="del-confirm" class="btn-danger">Delete</button>
      </div>
    </div>`;
    editModal.style.display='flex';
    document.getElementById('del-cancel').onclick=()=>{editModal.style.display='none';};
    editModal.onclick=(e)=>{if(e.target===editModal)editModal.style.display='none';};
    document.getElementById('del-confirm').onclick=()=>{
      editModal.style.display='none';
      undoItem = Object.assign({}, it);
      items=items.filter(x=>x.id!==id);
      deleteItem(id);
      rebuildLinks(); render();
      showUndo(it.text);
    };
  }

  function showUndo(text){
    if(undoTimer) clearTimeout(undoTimer);
    const short = text.length > 30 ? text.slice(0,30)+'…' : text;
    undoContainer.innerHTML=`<div class="undo-toast">"${esc(short)}" deleted <button id="undo-btn">Undo</button></div>`;
    document.getElementById('undo-btn').onclick=()=>{
      if(undoItem){
        items.push(undoItem);
        saveItem(undoItem);
        undoItem=null;
        rebuildLinks(); render();
      }
      undoContainer.innerHTML='';
      if(undoTimer) clearTimeout(undoTimer);
    };
    undoTimer = setTimeout(()=>{ undoContainer.innerHTML=''; undoItem=null; }, 6000);
  }

  function expand(id){const it=items.find(x=>x.id===id);if(it){it._open=!it._open;render();}}

  function openEdit(id){
    const it=items.find(x=>x.id===id);
    if(!it) return;
    editModal.innerHTML=`<div class="edit-panel">
      <h3>Edit item</h3>
      <label>Title</label>
      <input id="ed-text" type="text" value="${esc(it.text)}" />
      <label>Type</label>
      <select id="ed-kind">
        <option value="todo"${it.kind==='todo'?' selected':''}>To-do</option>
        <option value="reminder"${it.kind==='reminder'?' selected':''}>Reminder</option>
        <option value="meeting"${it.kind==='meeting'?' selected':''}>Meeting</option>
        <option value="doc"${it.kind==='doc'?' selected':''}>Doc / note</option>
      </select>
      <label>Priority</label>
      <select id="ed-priority">
        <option value="normal"${it.priority==='normal'?' selected':''}>Normal</option>
        <option value="high"${it.priority==='high'?' selected':''}>High priority</option>
      </select>
      <label>Due date</label>
      <input id="ed-due" type="date" value="${esc(it.due)}" />
      <label>People (comma-separated)</label>
      <input id="ed-people" type="text" value="${esc((it.people||[]).join(', '))}" />
      <label>Customer</label>
      <input id="ed-customer" type="text" value="${esc(it.customer)}" list="custlist" />
      <label>Meeting time / location</label>
      <input id="ed-meta" type="text" value="${esc(it.meta)}" />
      <label>Notes</label>
      <textarea id="ed-body" style="min-height:80px;">${esc(it.body)}</textarea>
      <div class="edit-actions">
        <button id="ed-cancel" style="padding:7px 16px;">Cancel</button>
        <button id="ed-save" class="btn-primary">Save</button>
      </div>
    </div>`;
    editModal.style.display='flex';
    document.getElementById('ed-cancel').onclick=()=>{editModal.style.display='none';};
    editModal.onclick=(e)=>{if(e.target===editModal)editModal.style.display='none';};
    document.getElementById('ed-save').onclick=()=>{
      it.text=document.getElementById('ed-text').value.trim()||it.text;
      it.kind=document.getElementById('ed-kind').value;
      it.priority=document.getElementById('ed-priority').value;
      it.due=document.getElementById('ed-due').value;
      it.people=parsePeople(document.getElementById('ed-people').value);
      it.customer=document.getElementById('ed-customer').value.trim();
      it.meta=document.getElementById('ed-meta').value.trim();
      it.body=document.getElementById('ed-body').value.trim();
      editModal.style.display='none';
      saveItem(it); rebuildLinks(); render();
    };
  }

  function rebuildLinks(){
    const ppl=new Set(),cust=new Set();
    items.forEach(it=>{(it.people||[]).forEach(p=>ppl.add(p));if(it.customer)cust.add(it.customer);});
    if(fPerson&&!ppl.has(fPerson))fPerson='';
    if(fCustomer&&!cust.has(fCustomer))fCustomer='';
    fPersonEl.innerHTML='<option value="">Person: all</option>'+[...ppl].sort().map(p=>`<option value="${esc(p)}"${p===fPerson?' selected':''}>${esc(p)}</option>`).join('');
    fCustomerEl.innerHTML='<option value="">Customer: all</option>'+[...cust].sort().map(c=>`<option value="${esc(c)}"${c===fCustomer?' selected':''}>${esc(c)}</option>`).join('');
    custlist.innerHTML=[...cust].sort().map(c=>`<option value="${esc(c)}">`).join('');
    clearLinksEl.style.display=(fPerson||fCustomer)?'':'none';
  }

  function matchSearch(it){
    if(!searchQ) return true;
    const q=searchQ.toLowerCase();
    return [it.text,it.body,it.customer,it.meta,(it.people||[]).join(' ')].filter(Boolean).some(s=>s.toLowerCase().includes(q));
  }

  function render(){
    const today=todayISO();
    let shown=items.filter(x=>!x.done);
    if(filter==='open') shown=shown.filter(x=>x.kind!=='doc');
    else if(filter==='today') shown=shown.filter(x=>dayjs(x.ts).format('YYYY-MM-DD')===today);
    else if(filter==='meeting') shown=shown.filter(x=>x.kind==='meeting');
    else if(filter==='doc') shown=shown.filter(x=>x.kind==='doc');
    if(fPerson) shown=shown.filter(x=>(x.people||[]).includes(fPerson));
    if(fCustomer) shown=shown.filter(x=>x.customer===fCustomer);
    shown=shown.filter(matchSearch);

    document.querySelectorAll('.fbtn').forEach(b=>{
      const on=b.getAttribute('data-filter')===filter;
      b.style.background=on?'var(--text-accent)':'';
      b.style.color=on?'white':'';
      b.style.borderColor=on?'var(--text-accent)':'';
    });

    const openTasks=items.filter(x=>!x.done&&(x.kind==='todo'||x.kind==='reminder')).length;
    const overdue=items.filter(isOverdueOrToday).length;
    const meetings=items.filter(x=>x.kind==='meeting'&&!x.done).length;
    const docs=items.filter(x=>x.kind==='doc').length;
    statsEl.innerHTML=[['Open tasks',openTasks,'var(--text-accent)'],['Due / overdue',overdue,overdue>0?'var(--text-warning)':'var(--text-primary)'],['Meetings',meetings,'var(--text-pro)'],['Docs / notes',docs,'var(--text-secondary)']]
      .map(([l,v,c])=>`<div class="stat-card"><div class="stat-label">${l}</div><div class="stat-value" style="color:${c};">${v}</div></div>`).join('');

    if(shown.length===0){
      const note=(fPerson||fCustomer||searchQ)?'No items match this filter.':'Nothing here yet. Add your first item above.';
      listEl.innerHTML=`<div style="text-align:center; padding:3rem 1rem; color:var(--text-muted);"><p style="margin:0; font-size:14px;">${note}</p></div>`;
    } else {
      let html='';
      const pinned=shown.filter(isOverdueOrToday).sort((a,b)=>(a.due<b.due?-1:1));
      if(pinned.length && filter!=='doc' && filter!=='meeting'){
        html+=`<div style="margin-bottom:1.5rem;"><div class="section-title" style="color:var(--text-warning);">Overdue / due today</div>`;
        pinned.forEach(it=>html+=rowHtml(it));
        html+=`</div>`;
      }
      const pinnedIds=new Set(pinned.map(x=>x.id));
      const rest=shown.filter(x=>!pinnedIds.has(x.id));
      const groups={};
      rest.sort((a,b)=>{
        const ao=a.sortOrder||0, bo=b.sortOrder||0;
        if(ao!==bo) return bo-ao;
        return b.ts-a.ts;
      }).forEach(it=>{const k=dayLabel(it.ts);(groups[k]=groups[k]||[]).push(it);});
      Object.keys(groups).forEach(day=>{
        const isToday=day===dayLabel(Date.now());
        html+=`<div style="margin-bottom:1.5rem;"><div class="section-title" style="color:${isToday?'var(--text-accent)':'var(--text-muted)'};">${day}${isToday?' · today':''}</div>`;
        groups[day].forEach(it=>html+=rowHtml(it));
        html+=`</div>`;
      });
      listEl.innerHTML=html;
    }

    // Completed section
    let doneItems = items.filter(x=>x.done);
    if(fPerson) doneItems=doneItems.filter(x=>(x.people||[]).includes(fPerson));
    if(fCustomer) doneItems=doneItems.filter(x=>x.customer===fCustomer);
    doneItems=doneItems.filter(matchSearch);

    if(doneItems.length > 0){
      let chtml=`<button class="completed-toggle" id="toggle-completed"><span class="arrow${showCompleted?' open':''}">▶</span> Completed (${doneItems.length})</button>`;
      if(showCompleted){
        chtml+=`<div style="margin-bottom:1.5rem;">`;
        doneItems.sort((a,b)=>b.ts-a.ts).forEach(it=>chtml+=rowHtml(it));
        chtml+=`</div>`;
      }
      completedSection.innerHTML=chtml;
      document.getElementById('toggle-completed').onclick=()=>{showCompleted=!showCompleted;render();};
    } else {
      completedSection.innerHTML='';
    }

    bind();
  }

  function rowHtml(it){
    const m=kindMeta[it.kind];
    const canCheck=(it.kind==='todo'||it.kind==='reminder'||it.kind==='meeting');
    const high=it.priority==='high'&&!it.done;
    const dueSoon=isDueSoon(it)&&!high;
    let cls='item-row';
    if(high) cls+=' high-priority';
    else if(dueSoon) cls+=' due-soon';
    let h=`<div class="${cls}" draggable="true" data-drag-id="${it.id}">`;
    h+=`<div style="display:flex; align-items:flex-start; gap:8px;">`;
    if(!it.done) h+=`<span class="drag-handle" title="Drag to reorder">⠿</span>`;
    if(canCheck) h+=`<button data-toggle="${it.id}" style="flex:0 0 auto; width:20px; height:20px; padding:0; border-radius:50%; border:2px solid ${it.done?'var(--text-success)':'var(--border-strong)'}; ${it.done?'background:var(--text-success); color:white;':'background:none;'} font-size:12px; line-height:16px; text-align:center;">${it.done?'✓':''}</button>`;
    else h+=`<span style="flex:0 0 auto; width:20px; text-align:center; color:var(--text-muted);">·</span>`;
    h+=`<div style="flex:1; min-width:0;"><div style="font-size:14px; font-weight:500; color:var(--text-primary); ${it.done?'text-decoration:line-through; color:var(--text-muted); font-weight:400;':''}">${high?'⚑ ':''}${esc(it.text)}</div>`;
    h+=`<div style="display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap;">`;
    h+=`<span class="tag" style="background:${m.bg}; color:${m.color};">${m.label}</span>`;
    if(it.meta) h+=`<span style="font-size:11px; color:var(--text-pro);">${esc(it.meta)}</span>`;
    if(it.due){
      const od=isOverdueOrToday(it);
      const ds=isDueSoon(it);
      let dueColor=od?'var(--text-warning)':ds?'var(--text-due-soon)':'var(--text-muted)';
      let dueLabel=it.kind==='meeting'?'':'due ';
      if(ds&&!od) dueLabel='due soon · ';
      h+=`<span style="font-size:11px; color:${dueColor}; ${ds&&!od?'font-weight:500;':''}">${dueLabel}${dayjs(it.due).format('MMM D')}</span>`;
    }
    if(it.customer) h+=`<span data-fc="${esc(it.customer)}" class="tag" style="background:var(--bg-success); color:var(--text-success); cursor:pointer;">${esc(it.customer)}</span>`;
    (it.people||[]).forEach(p=>h+=`<span data-fp="${esc(p)}" class="tag" style="background:var(--surface-2); color:var(--text-secondary); cursor:pointer;">${esc(p)}</span>`);
    if(it.body) h+=`<button data-expand="${it.id}" class="btn-ghost" style="font-size:11px; padding:1px 6px; color:var(--text-accent);">${it._open?'Hide notes':'Notes'}</button>`;
    h+=`</div></div>`;
    h+=`<button data-edit="${it.id}" class="btn-ghost" style="flex:0 0 auto; font-size:12px; padding:2px 6px;">Edit</button>`;
    h+=`<button data-del="${it.id}" class="btn-ghost" style="flex:0 0 auto; font-size:16px; padding:0 4px; line-height:1;">×</button>`;
    h+=`</div>`;
    if(it.body&&it._open) h+=`<div style="margin-top:10px; padding:10px 14px; background:var(--surface-0); border:1px solid var(--border); border-radius:var(--radius); font-size:13px; line-height:1.6; white-space:pre-wrap; color:var(--text-secondary);">${esc(it.body)}</div>`;
    h+=`</div>`;
    return h;
  }

  function bind(){
    document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.getAttribute('data-toggle')));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDel(b.getAttribute('data-del')));
    document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>expand(b.getAttribute('data-expand')));
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.getAttribute('data-edit')));
    document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{fPerson=b.getAttribute('data-fp');fCustomer='';rebuildLinks();render();});
    document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{fCustomer=b.getAttribute('data-fc');fPerson='';rebuildLinks();render();});

    // Drag and drop
    document.querySelectorAll('[data-drag-id]').forEach(el=>{
      el.addEventListener('dragstart',(e)=>{
        dragId=el.getAttribute('data-drag-id');
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
        dragId=null;
      });
      el.addEventListener('dragover',(e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        if(el.getAttribute('data-drag-id')!==dragId){
          document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
          el.classList.add('drag-over');
        }
      });
      el.addEventListener('dragleave',()=>{el.classList.remove('drag-over');});
      el.addEventListener('drop',(e)=>{
        e.preventDefault();
        el.classList.remove('drag-over');
        const targetId=el.getAttribute('data-drag-id');
        if(dragId && dragId!==targetId){
          const dragItem=items.find(x=>x.id===dragId);
          const targetItem=items.find(x=>x.id===targetId);
          if(dragItem && targetItem){
            const temp=dragItem.sortOrder;
            dragItem.sortOrder=targetItem.sortOrder;
            targetItem.sortOrder=temp;
            saveItem(dragItem);
            saveItem(targetItem);
            save();
            render();
          }
        }
      });
    });
  }

  function printBriefing(){
    let w=window.open('','_blank');
    const today=dayjs().format('dddd, MMMM D, YYYY');
    const sortByDatePriority=(a,b)=>{
      if(a.priority==='high'&&b.priority!=='high') return -1;
      if(b.priority==='high'&&a.priority!=='high') return 1;
      if(a.due&&b.due) return a.due<b.due?-1:a.due>b.due?1:0;
      if(a.due) return -1;
      if(b.due) return 1;
      return b.ts-a.ts;
    };
    const checkbox=it=>`<span style="display:inline-block;width:14px;height:14px;border:1.5px solid #888;border-radius:3px;margin-right:8px;vertical-align:middle;${it.done?'background:#16a34a;border-color:#16a34a;':''}"></span>`;
    const row=it=>{
      const high=it.priority==='high';
      let r=`<tr style="${high?'font-weight:600;':''}">`;
      r+=`<td style="padding:6px 8px;border-bottom:1px solid #eee;white-space:nowrap;">${checkbox(it)}</td>`;
      r+=`<td style="padding:6px 8px;border-bottom:1px solid #eee;${it.done?'text-decoration:line-through;color:#999;':''}">${high?'<span style="color:#c2410c;">⚑</span> ':''}${esc(it.text)}`;
      if(it.body) r+=`<div style="font-size:11px;color:#777;margin-top:2px;font-weight:400;">${esc(it.body.slice(0,150))}${it.body.length>150?'…':''}</div>`;
      r+=`</td>`;
      r+=`<td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:12px;color:#555;">${it.due?dayjs(it.due).format('MMM D'):''}</td>`;
      r+=`<td style="padding:6px 8px;border-bottom:1px solid #eee;">${it.customer?'<span style="background:#f0fdf4;color:#15803d;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500;">'+esc(it.customer)+'</span>':''}</td>`;
      r+=`<td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:11px;color:#777;">${(it.people||[]).map(p=>esc(p)).join(', ')}</td>`;
      r+=`</tr>`;
      return r;
    };
    const thead=`<thead><tr style="background:#f8f9fb;"><th style="padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#888;border-bottom:2px solid #ddd;width:30px;"></th><th style="padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#888;border-bottom:2px solid #ddd;">Item</th><th style="padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#888;border-bottom:2px solid #ddd;width:80px;">Due</th><th style="padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#888;border-bottom:2px solid #ddd;width:120px;">Customer</th><th style="padding:8px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#888;border-bottom:2px solid #ddd;width:120px;">People</th></tr></thead>`;
    const sec=(title,color,arr)=>{
      if(!arr.length) return '';
      arr.sort(sortByDatePriority);
      return `<h2 style="font-size:14px;font-weight:600;color:${color};margin:28px 0 8px;padding-bottom:4px;">${title} <span style="font-weight:400;color:#999;font-size:12px;">(${arr.length})</span></h2><table style="width:100%;border-collapse:collapse;">${thead}<tbody>${arr.map(row).join('')}</tbody></table>`;
    };
    let body=`<div style="border-bottom:2px solid #2563eb;padding-bottom:12px;margin-bottom:8px;"><h1 style="margin:0;font-size:22px;font-weight:600;color:#1a1a2e;">AG Daily Briefing</h1><p style="margin:4px 0 0;font-size:13px;color:#888;">${today}</p></div>`;
    body+=sec('Overdue / Due Today','#c2410c',items.filter(isOverdueOrToday));
    body+=sec('Meetings','#7c3aed',items.filter(x=>x.kind==='meeting'&&!x.done));
    body+=sec('Open Tasks','#2563eb',items.filter(x=>!x.done&&(x.kind==='todo'||x.kind==='reminder')&&!isOverdueOrToday(x)));
    body+=sec('Docs / Notes','#555',items.filter(x=>x.kind==='doc'));
    body+=`<div style="margin-top:32px;padding-top:12px;border-top:1px solid #ddd;font-size:11px;color:#aaa;">Generated ${dayjs().format('MMM D, YYYY [at] h:mm A')}</div>`;
    w.document.write(`<html><head><title>AG Daily Briefing — ${today}</title><style>body{font-family:'Inter',system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 24px;color:#1a1a2e;-webkit-print-color-adjust:exact;print-color-adjust:exact;}table{font-size:13px;}@media print{body{margin:20px auto;}}</style></head><body>${body}</body></html>`);
    w.document.close(); w.print();
  }

  function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  $('add').onclick=addItem;
  entryEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&kindEl.value!=='doc')addItem();});
  document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{filter=b.getAttribute('data-filter');render();});
  fPersonEl.onchange=()=>{fPerson=fPersonEl.value;render();rebuildLinks();};
  fCustomerEl.onchange=()=>{fCustomer=fCustomerEl.value;render();rebuildLinks();};
  clearLinksEl.onclick=()=>{fPerson='';fCustomer='';rebuildLinks();render();};
  searchEl.addEventListener('input',()=>{searchQ=searchEl.value.trim();render();});
  $('btn-print').onclick=printBriefing;

  syncFields();
  initAuth();
})();
</script>
</body>
</html>
